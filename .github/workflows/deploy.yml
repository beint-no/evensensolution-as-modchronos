name: Build storefront
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: build-storefront
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-fund
      - run: npm run check
      - name: Build Worker and assets
        env:
          ASSETS_DIRECTORY: "./public"
        run: |
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/storefront/worker"
          cp -R "$ASSETS_DIRECTORY" "$RUNNER_TEMP/storefront/assets"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storefront
          path: ${{ runner.temp }}/storefront
          if-no-files-found: error
          retention-days: 7
      - name: Request deployment
        env:
          DEPLOYMENT_URL: "https://app.reai.no/online-store/deployment/request"
        run: |
          node --input-type=module <<'JS'
          const tokenResponse = await fetch(process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=reai-storefront', {
            headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }
          });
          if (!tokenResponse.ok) throw new Error('GitHub identity token request failed');
          const { value } = await tokenResponse.json();
          console.log('::add-mask::' + value);
          const response = await fetch(process.env.DEPLOYMENT_URL, {
            method: 'POST', headers: { Authorization: 'Bearer ' + value }
          });
          if (!response.ok) throw new Error('Deployment request failed: ' + response.status);
          JS
